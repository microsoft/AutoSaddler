name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check src/autosaddler tests/
      - name: Enforce public scenario boundary
        run: |
          if git grep -I -n -E 'copilot_studio|Copilot Studio|ThinkingBox|Agent17|RalphLoop|/DERA' -- . \
            ':!.github/workflows/ci.yml'; then
            echo "Private scenario material is not allowed in the public repository."
            exit 1
          fi
      - name: Test
        run: uv run python -m pytest tests/ -v --tb=short
      - name: Build distributions
        run: uv build