# Bounded V2 Meta-ARE/GAIA2 example. Paths are relative to this file.
# Expected sibling layout: AutoSaddler/, Meta-ARE/, meta_are_data/, working_dir/.
schema_version: autosaddler/v2

scenario:
  type: meta_are
  settings:
    # Local clone of the adapted https://github.com/pshlego/Meta-ARE repository.
    source_repo: ../../../Meta-ARE
    base_revision: 395d1dd512add1e3aeb5a6a092490768b51e3ce5
    data_mode: local_only
    dataset_root: ../../../Meta-ARE/datasets_local/gaia2_smoke
    dataset_source_revision: 78ea3bdbdeec2bdcd6afa5420915d8a22f23ed99
    dataset_source_descriptor: ../../../Meta-ARE/datasets_local/gaia2_smoke/.autosaddler-gaia2-source.json
    train_manifest: ../datasets/GAIA2/train_smoke.json
    development_manifest: ../datasets/GAIA2/val_smoke.json
    test_manifest: ../datasets/GAIA2/test_universe_22.json
    writable_paths:
      - are/simulation/agents/default_agent
      - are/simulation/agents/are_simulation_agent_config.py
      - are/simulation/agents/agent_config_builder.py
      - are/simulation/apps/agent_user_interface.py
      - hook.json
    forbidden_paths:
      - are/simulation/validation
      - are/simulation/scenarios
      - are/simulation/benchmark
      - are/simulation/benchmark.py
      - are/simulation/tests
      - are/simulation/data
      - are/simulation/data_handler
      - are/simulation/checkpoint
      - are/simulation/tutorials
      - are/simulation/gui
    demo_filesystem_root: ../../../meta_are_data/gaia2_filesystem/132e26376f5e963bb59f64bcccdd02188cb08dee/demo_filesystem
    demo_filesystem_source_revision: 132e26376f5e963bb59f64bcccdd02188cb08dee
    demo_filesystem_source_descriptor: ../../../meta_are_data/gaia2_filesystem/132e26376f5e963bb59f64bcccdd02188cb08dee/source.json
    demo_filesystem_manifest: ../../../meta_are_data/gaia2_filesystem/132e26376f5e963bb59f64bcccdd02188cb08dee/manifest.json
    benchmark_config: autosaddler_selected
    benchmark_split: validation
    agent: default
    model: gpt-4.1-mini
    model_provider: openai
    model_wire_api: chat_completions
    model_endpoint: null
    reasoning_effort: null
    judge_model: gpt-4.1-mini
    judge_provider: openai
    judge_endpoint: null
    scenario_timeout_seconds: 1800
    process_completion_grace_seconds: 60
    verification_timeout_seconds: 300
    repetitions: 1
    max_concurrent: 1
    infrastructure_retries: 1
    import_check: from are.simulation.agents.default_agent import base_agent
    capability_phase_iterations: 1

optimization:
  task_selection:
    type: epoch_shuffled
    batch_size: 2
    seed: 0
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 22
    max_iterations: 2
  diagnosis_patch_timeout_seconds: 600
  selection_timeout_seconds: 300
  reflection_timeout_seconds: 300
  session_retries: 2
  session_retry_backoff_seconds: 15

provider:
  type: claude
  capabilities: [read_workspace, edit_workspace, run_commands, load_skills]
  settings:
    model: claude-opus-4-6
    effort: max
    permission_mode: bypassPermissions
    base_url: https://api.anthropic.com

storage:
  type: local
  run_root: ../../../working_dir/outputs/v2_meta_are/runs