# Dependency-free V2 template for validating the optimization engine locally.
schema_version: autosaddler/v2
scenario:
  type: fake
  settings:
    baseline:
      instruction: baseline
    target_component: instruction
    improved_text: improved
    train_case_ids: [train-a, train-b]
    development_case_ids: [dev-a, dev-b]
optimization:
  task_selection:
    type: fixed
    batch_size: 2
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 100
    max_iterations: 1
  diagnosis_patch_timeout_seconds: 30
provider:
  type: fake
  capabilities: [read_workspace, edit_workspace, load_skills]
  settings: {}
storage:
  type: local
  run_root: ../../outputs/v2-template