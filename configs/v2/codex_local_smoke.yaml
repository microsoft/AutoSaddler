# Real Codex optimizer with a deterministic, local evaluator. Uses Codex quota.
schema_version: autosaddler/v2
scenario:
  type: fake
  settings:
    baseline:
      instruction: baseline
    target_component: instruction
    improved_text: improved
    train_case_ids: [train-a, train-b]
    development_case_ids: [dev-a, dev-b]
optimization:
  task_selection:
    type: fixed
    batch_size: 2
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 100
    max_iterations: 1
  diagnosis_patch_timeout_seconds: 120
  selection_timeout_seconds: 120
  reflection_timeout_seconds: 120
provider:
  type: codex
  capabilities: [read_workspace, edit_workspace, run_commands, load_skills]
  settings:
    model: gpt-5.5
    reasoning_effort: low
    executable: codex
storage:
  type: local
  run_root: ../../outputs/v2-codex-template
